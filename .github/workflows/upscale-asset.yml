name: Upscale ad asset
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/TRIGGER_UPSCALE'
jobs:
  upscale:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upscale JPEG to min 800 height
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          file keypra-save-for-work-x-v2.jpg
          identify keypra-save-for-work-x-v2.jpg || true
          ffmpeg -y -i keypra-save-for-work-x-v2.jpg -vf 'scale=1422:800' -q:v 3 keypra-sfw-up.jpg
          mv keypra-sfw-up.jpg keypra-save-for-work-x-v2.jpg
          file keypra-save-for-work-x-v2.jpg
          identify keypra-save-for-work-x-v2.jpg || true
          ls -la keypra-save-for-work-x-v2.jpg
      - name: Commit upscaled JPEG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add keypra-save-for-work-x-v2.jpg
          git diff --cached --quiet || (git commit -m 'Upscale SFW JPEG to 1422x800 for website cards' && git push)
