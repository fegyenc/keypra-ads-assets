name: Decode ad asset
on:
  push:
    paths:
      - 'assets/*.b64'
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG
        run: |
          cat assets/keypra-save-for-work-x-v2.jpg.b64.part-* > /tmp/all.b64
          base64 -d /tmp/all.b64 > keypra-save-for-work-x-v2.jpg
          file keypra-save-for-work-x-v2.jpg
      - name: Commit binary
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add keypra-save-for-work-x-v2.jpg
          git diff --cached --quiet || git commit -m 'Add decoded Save-for-work v2 JPEG'
          git push
